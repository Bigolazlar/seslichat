
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hırçın Lazlar - Canlı Sohbet</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080f16;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 text-align:center;
 padding:15px;
 background:#111c27;
}

h1{color:#20d879;margin:5px}
header p{color:#aab5c0;margin:5px}

#login{
 max-width:430px;
 margin:35px auto;
 padding:25px;
 background:#151d25;
 border-radius:18px;
 text-align:center;
}

input{
 width:100%;
 padding:14px;
 border:1px solid #34414e;
 border-radius:10px;
 background:#0c141c;
 color:white;
 font-size:16px;
}

button{
 padding:13px;
 border:0;
 border-radius:10px;
 background:#20d879;
 color:#07140d;
 font-weight:bold;
 cursor:pointer;
}

#join{width:100%;margin-top:12px}

#status{
 text-align:center;
 color:#20d879;
 padding:10px;
}

#workspace{
 display:none;
 grid-template-columns:minmax(0, 2fr) minmax(280px, 1fr);
 gap:12px;
 padding:12px;
 width:100%;
 height:calc(100vh - 145px);
 min-height:500px;
}

.video-box,.chat-box{
 background:#151d25;
 border:1px solid #283746;
 border-radius:15px;
 overflow:hidden;
 min-height:0;
}

.video-box{
 display:flex;
 flex-direction:column;
 min-width:0;
}

.box-title{
 padding:13px;
 background:#202d39;
 font-weight:bold;
}

#meet{
 flex:1;
 min-height:0;
 width:100%;
}

#meet iframe{
 border:0;
 width:100%;
 height:100%;
}

.chat-box{
 display:flex;
 flex-direction:column;
 min-width:0;
 height:100%;
}

#messages{
 flex:1;
 min-height:100px;
 overflow-y:auto;
 padding:12px;
 text-align:left;
}

.message{
 background:#202d39;
 border-radius:10px;
 padding:10px;
 margin-bottom:9px;
 overflow-wrap:anywhere;
}

.message .sender{
 color:#20d879;
 font-weight:bold;
 font-size:13px;
}

.message .content{
 margin-top:5px;
 white-space:pre-wrap;
}

#chat-form{
 display:flex;
 gap:7px;
 padding:10px;
 background:#202d39;
}

#chat-input{
 flex:1;
 min-width:0;
}

#send{
 padding:0 15px;
}

#leave{
 display:none;
 margin:12px auto;
 background:#e74c3c;
 color:white;
}

footer{
 text-align:center;
 padding:15px;
 color:#687786;
}

@media(max-width:700px){
 #workspace{
   grid-template-columns:1fr;
   height:auto;
   min-height:0;
 }
 .video-box{
   height:55vh;
   min-height:350px;
 }
 .chat-box{
   height:400px;
 }
}
</style>
</head>

<body>

<header>
<h1>😎 HIRÇIN LAZLAR</h1>
<p>🎥 Görüntülü ve Yazılı Sohbet</p>
</header>

<div id="login">
<h2>Genel Sohbete Katıl</h2>
<input id="username"
 placeholder="Takma adını yaz"
 maxlength="30"
 autocomplete="off">
<button id="join">SOHBETE KATIL</button>
<p>Üyelik yok • E-posta yok • Şifre yok</p>
</div>

<div id="status">Arkadaşlarınla buluşmaya hazır mısın?</div>

<div id="workspace">

 <section class="video-box">
   <div class="box-title">🎥 Canlı Kameralar</div>
   <div id="meet"></div>
 </section>

 <section class="chat-box">
   <div class="box-title">💬 GENEL SOHBET</div>

   <div id="messages">
     <div class="message">
       <div class="sender">Sistem</div>
       <div class="content">Hırçın Lazlar'a hoş geldin!</div>
     </div>
   </div>

   <form id="chat-form">
     <input id="chat-input"
       placeholder="Mesajını yaz..."
       maxlength="1000"
       autocomplete="off">
     <button id="send" type="submit">Gönder</button>
   </form>
 </section>

</div>

<button id="leave">SOHBETTEN AYRIL</button>

<footer>🔥 Hırçın Lazlar © 2026</footer>

<script>
let api=null;
let connecting=false;
let currentName="";

const ROOM="HircinLazlarGenelSohbet2026";

const login=document.getElementById("login");
const workspace=document.getElementById("workspace");
const statusText=document.getElementById("status");
const messages=document.getElementById("messages");
const joinButton=document.getElementById("join");
const leaveButton=document.getElementById("leave");

function addMessage(name,message){

 const box=document.createElement("div");
 box.className="message";

 const sender=document.createElement("div");
 sender.className="sender";
 sender.textContent=name;

 const content=document.createElement("div");
 content.className="content";
 content.textContent=message;

 box.appendChild(sender);
 box.appendChild(content);
 messages.appendChild(box);

 messages.scrollTop=messages.scrollHeight;
}

function resetRoom(message){

 const oldApi=api;
 api=null;
 connecting=false;

 if(oldApi){
   try{oldApi.dispose()}catch(e){}
 }

 statusText.textContent=message;
 workspace.style.display="none";
 login.style.display="block";
 leaveButton.style.display="none";

 document.getElementById("meet").innerHTML="";

 messages.innerHTML="";
 addMessage("Sistem","Hırçın Lazlar'a hoş geldin!");

 joinButton.disabled=false;
}

function startMeeting(name){

 currentName=name;

 login.style.display="none";
 workspace.style.display="grid";
 leaveButton.style.display="block";

 messages.innerHTML="";
 addMessage("Sistem","Genel Sohbet'e hoş geldin "+name+"!");

 try{

 api=new JitsiMeetExternalAPI("meet.jit.si",{

   roomName:ROOM,
   parentNode:document.getElementById("meet"),
   width:"100%",
   height:"100%",

   userInfo:{
     displayName:name
   },

   configOverwrite:{
     prejoinPageEnabled:false,
     startWithAudioMuted:true,
     startWithVideoMuted:true,
     toolbarButtons:[
       "microphone",
       "camera",
       "desktop",
       "participants-pane",
       "tileview",
       "hangup",
       "fullscreen",
       "settings"
     ]
   },

   interfaceConfigOverwrite:{
     DISABLE_JOIN_LEAVE_NOTIFICATIONS:false
   }

 });

 api.addEventListener("videoConferenceJoined",()=>{
   connecting=false;
   statusText.textContent="🟢 Genel Sohbet'e bağlandın!";
   addMessage("Sistem","Bağlantı başarılı.");
 });

 // Diğer kullanıcıların mesajlarını göster
 api.addEventListener("incomingMessage",(event)=>{

   if(event.message){
     addMessage(
       event.nick || "Misafir",
       event.message
     );
   }

 });

 api.addEventListener("videoConferenceLeft",()=>{
   resetRoom("Sohbetten ayrıldın.");
 });

 api.addEventListener("readyToClose",()=>{
   resetRoom("Sohbet kapatıldı.");
 });

 }catch(error){
   resetRoom("Bağlantı hatası. Tekrar deneyin.");
 }
}

joinButton.onclick=function(){

 if(connecting || api)return;

 const name=document.getElementById("username").value.trim();

 if(!name){
   alert("Lütfen takma adını yaz.");
   return;
 }

 connecting=true;
 joinButton.disabled=true;
 statusText.textContent="Bağlanılıyor...";

 function loadJitsi(){
   startMeeting(name);
 }

 if(window.JitsiMeetExternalAPI){
   loadJitsi();
 }else{

   const script=document.createElement("script");
   script.src="https://meet.jit.si/external_api.js";

   script.onload=loadJitsi;

   script.onerror=()=>{
     connecting=false;
     joinButton.disabled=false;
     statusText.textContent="Bağlantı kurulamadı.";
   };

   document.head.appendChild(script);
 }
};

// Mesaj gönder
document.getElementById("chat-form").onsubmit=function(e){

 e.preventDefault();

 const input=document.getElementById("chat-input");
 const message=input.value.trim();

 if(!message || !api)return;

 try{

   api.executeCommand("sendChatMessage",message);

   // Mesajı burada tekrar eklemiyoruz.
   // Kendi mesajımız incomingMessage ile gelirse gösterilecek.

   input.value="";

 }catch(error){
   statusText.textContent="Mesaj gönderilemedi.";
 }
};

// Sohbetten ayrıl
leaveButton.onclick=function(){

 if(api){
   try{
     api.executeCommand("hangup");
   }catch(e){
     resetRoom("Sohbetten ayrıldın.");
   }
 }
};

</script>

</body>
</html>
